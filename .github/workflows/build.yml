name: Build

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MINVERBUILDMETADATA: build.${{github.run_number}}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Dotnet Tool Restore
        run: dotnet tool restore

      - name: Format Check
        run: dotnet csharpier check .

      - name: Dotnet Restore
        run: dotnet restore adaptive-rate-limiting-dotnet.slnx

      - name: Dotnet Build
        run: dotnet build adaptive-rate-limiting-dotnet.slnx --configuration Release --no-restore

      - name: Dotnet Test
        run: >
          dotnet test --solution adaptive-rate-limiting-dotnet.slnx
          --configuration Release --no-build
          --report-trx --results-directory ./Artefacts

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./Artefacts
          if-no-files-found: ignore

  pack:
    name: Pack
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Dotnet Pack
        run: >
          dotnet pack adaptive-rate-limiting-dotnet.slnx
          --configuration Release --output ./Artefacts

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            ./Artefacts/*.nupkg
            ./Artefacts/*.snupkg

  push-nuget:
    name: Push NuGet
    needs: pack
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: NuGet
      url: https://www.nuget.org/packages/Nall.RateLimiting.Adaptive
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./Artefacts

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Dotnet NuGet Push
        run: >
          dotnet nuget push ./Artefacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
